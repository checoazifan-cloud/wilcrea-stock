<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5fb;--card:#fff;--tx:#0c1650;--mut:#5b6385;--br:#d8ddee;--pr:#1457e6;--prt:#fff;--hl:#e8eefc;--dg:#c62828;--ac:#ff6a13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a0f2b;--card:#121a45;--tx:#e9edff;--mut:#9ca6d6;--br:#26306b;--pr:#5b8dff;--prt:#07123a;--hl:#1a2559;--dg:#ff9a94;--ac:#ff7a2e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0f2b;--card:#121a45;--tx:#e9edff;--mut:#9ca6d6;--br:#26306b;--pr:#5b8dff;--prt:#07123a;--hl:#1a2559;--dg:#ff9a94;--ac:#ff7a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 14px;margin-bottom:6px;background:var(--card);border-bottom:4px solid var(--ac)}
.logo{height:84px;border-radius:10px;background:#fff}
#pdfall{background:var(--ac);border-color:var(--ac);color:#fff}
h1{margin:0;font-size:20px}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{padding:0 12px 24px;max-width:1100px;margin:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.tabs button{flex:none;padding:8px 14px;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:20px;font-size:14px}
.tabs button.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.bar label{font-size:13px;color:var(--mut)}
.btn{padding:8px 12px;border:1px solid var(--pr);background:var(--pr);color:var(--prt);border-radius:8px;font-size:14px}
.btn.alt{background:transparent;color:var(--pr)}
.btn.dg{background:transparent;color:var(--dg);border-color:var(--dg)}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--br);border-radius:6px;padding:6px;width:100%;min-width:0}
.wrap{overflow-x:auto;border:1px solid var(--br);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:6px;border-bottom:1px solid var(--br);text-align:left;font-size:14px}
th{background:var(--hl);border-bottom:2px solid var(--ac);font-size:12px;white-space:nowrap}
td.c{font-weight:600;text-align:right;white-space:nowrap;padding-right:10px}
td.r{color:var(--pr)}
tr.hide{display:none}
td button{background:none;border:0;color:var(--dg);font-size:15px;padding:6px}
.sum{margin:10px 2px;font-weight:600}
.note,#msg{color:var(--mut);font-size:13px;margin:8px 2px}
#msg{color:var(--pr)}
footer{margin-top:18px;color:var(--mut);font-size:13px}
</style>
</head>

<script>
const P=['Maïs','Riz','Haricot','Huile','Sel'], KEY='wilcrea-stock-v3';
const blank=()=>({d:'',e:'',s:'',r:'',f:'',o:'R='});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.prods){S={cur:P[0],prods:{}}}
P.forEach(p=>{const x=S.prods[p]=S.prods[p]||{init:'',rows:[]};if(!x.rows.length)x.rows.push(blank());x.rows.forEach((r,i)=>{if(r.d===undefined)r.d=(S.dates&&S.dates[i])||''})});delete S.dates;if(S.sync===undefined)S.sync=true;
function align(){const src=S.prods[S.cur].rows,n=Math.max(...P.map(p=>S.prods[p].rows.length));P.forEach(p=>{const rw=S.prods[p].rows;while(rw.length<n)rw.push(blank());rw.forEach((r,i)=>{r.d=(src[i]&&src[i].d)||r.d||''})})}
if(!P.includes(S.cur))S.cur=P[0];
let dl=null;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const rep=o=>{const m=/(?:^|[^A-Za-z])R(?:este)?\s*[=:]?\s*(\d+(?:[.,]\d+)?)/i.exec(o||'');return m?num(m[1]):0};
const esc=v=>String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt=n=>{const x=Math.round(n*1e9)/1e9;return (Math.trunc(Math.round(x*1e6)/1e3)/1e3).toLocaleString('fr-FR',{maximumFractionDigits:3})};
const dfmt=v=>{const d=v.replace(/\D/g,'').slice(0,8);return d.slice(0,2)+(d.length>2?'/'+d.slice(2,4):'')+(d.length>4?'/'+d.slice(4):'')};
const fd=d=>d?d.split('-').reverse().join('/'):'';
function calc(p){let prev=num(S.prods[p].init);return S.prods[p].rows.map(r=>{const i0=prev,d=i0+num(r.e),R=rep(r.o),re=d-num(r.s);prev=re+R;return{i0,d,re}})}
function tabs(){$('tabs').innerHTML=P.map(p=>`<button class="${p===S.cur?'on':''}" data-p="${p}">${p}</button>`).join('')}
function render(){
  const x=S.prods[S.cur];
  $('tb').innerHTML=x.rows.map((r,i)=>`<tr data-i="${i}">
<td><input data-k="d" inputmode="numeric" placeholder="jj/mm/aaaa" maxlength="10" value="${esc(r.d||'')}"></td>
<td>${i?`<span class="c" id="si${i}"></span>`:`<input data-k="init" inputmode="decimal" value="${esc(x.init)}">`}</td>
<td><input data-k="e" inputmode="decimal" value="${esc(r.e)}"></td>
<td class="c" id="di${i}"></td>
<td><input data-k="s" inputmode="decimal" value="${esc(r.s)}"></td>
<td class="c r" id="re${i}"></td>
<td><input data-k="f" value="${esc(r.f)}"></td>
<td><input data-k="o" inputmode="decimal" value="${esc(r.o||'R=')}"></td>
<td><button data-del title="Supprimer la ligne">✕</button></td></tr>`).join('');
  refresh();filter();
}
function refresh(){
  const c=calc(S.cur);
  c.forEach((v,i)=>{const a=$('si'+i);if(a)a.textContent=fmt(v.i0);$('di'+i).textContent=fmt(v.d);$('re'+i).textContent=fmt(v.re)});
  $('sum').textContent=c.length?`Restant actuel ${S.cur} : ${fmt(c[c.length-1].re)} Kg`:'';
}
function filter(){
  const f=$('flt').value;
  [...$('tb').rows].forEach((tr,i)=>tr.classList.toggle('hide',!!f&&S.prods[S.cur].rows[i].d!==f));
}
$('tabs').onclick=e=>{const p=e.target.dataset.p;if(p){S.cur=p;save();tabs();render()}};
$('tb').oninput=e=>{
  const k=e.target.dataset.k,i=e.target.closest('tr').dataset.i;
  if(k==='d'){const v=dfmt(e.target.value);e.target.value=v;S.prods[S.cur].rows[i].d=v;if(S.sync)P.forEach(p=>{const rw=S.prods[p].rows;while(rw.length<=i)rw.push(blank());rw[i].d=v});filter()}
  else if(k==='init')S.prods[S.cur].init=e.target.value;
  else if(k==='o'){const v='R='+e.target.value.replace(/^\s*R?\s*[=:]?/i,'').replace(/[^0-9.,]/g,'');e.target.value=v;S.prods[S.cur].rows[i].o=v}
  else S.prods[S.cur].rows[i][k]=e.target.value;
  refresh();save();
};
function ask(btn,txt,fn){
  if(btn.dataset.arm){clearTimeout(btn._t);delete btn.dataset.arm;btn.textContent=btn.dataset.t;fn();return}
  btn.dataset.t=btn.textContent;btn.dataset.arm=1;btn.textContent=txt;
  btn._t=setTimeout(()=>{delete btn.dataset.arm;btn.textContent=btn.dataset.t},3000);
}
$('tb').onclick=e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  const i=+b.closest('tr').dataset.i;
  ask(b,'Sûr ?',()=>{
    (S.sync?P:[S.cur]).forEach(p=>{const rw=S.prods[p].rows;if(rw.length<2)S.prods[p].rows=[blank()];else if(i<rw.length)rw.splice(i,1)});
    save();render();
  });
};
$('add').onclick=()=>{(S.sync?P:[S.cur]).forEach(p=>S.prods[p].rows.push(blank()));save();render()};
$('wipe').onclick=function(){ask(this,'Confirmer ?',()=>{S.prods[S.cur]={init:'',rows:S.sync?S.prods[S.cur].rows.map(r=>({...blank(),d:r.d})):[blank()]};save();render()})};
$('flt').oninput=e=>{e.target.value=dfmt(e.target.value);filter()};
$('clr').onclick=()=>{$('flt').value='';filter()};
function say(t){$('msg').textContent=t}
async function makePDF(list){
  if(!window.jspdf){say('Le module PDF n’est pas chargé. Vérifiez la connexion.');return}
  const f=$('flt').value,doc=new window.jspdf.jsPDF({orientation:'landscape'});
  list.forEach((p,n)=>{
    if(n)doc.addPage();
    const c=calc(p),rows=S.prods[p].rows;
    const body=rows.map((r,i)=>[r.d,fmt(c[i].i0),fmt(num(r.e)),fmt(c[i].d),fmt(num(r.s)),fmt(c[i].re),r.f,/\d/.test(r.o||'')?r.o:'',i]).filter(b=>!f||b[0]===f).map(b=>b.slice(0,8));
    doc.setFontSize(16);doc.text('Wilcréa — Stock de '+p,14,16);
    doc.setFontSize(10);doc.text(f?'Date : '+f:'Toutes les dates',14,23);
    doc.autoTable({startY:28,head:[['Date','Stock initial (Kg)','Entrée / Dotation (Kg)','Stock disponible (Kg)','Sortie (Kg)','Stock restant (Kg)','Réf','Observations']],body,headStyles:{fillColor:[12,22,80]},styles:{fontSize:9}});
  });
  const name=list.length>1?'stock-wilcrea-tous.pdf':'stock-'+list[0].toLowerCase()+'.pdf',buf=doc.output('arraybuffer');
  if(dl){try{await dl.save({filename:name,data:buf});say('PDF enregistré.')}catch(e){say(e&&e.code==='declined'?'Téléchargement annulé.':'Téléchargement impossible.')}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();a.remove();say('PDF téléchargé.')}
}
$('pdf').onclick=()=>makePDF([S.cur]);
$('pdfall').onclick=()=>makePDF(P);
if(S.sync)align();
$('sync').checked=!!S.sync;$('sync').onchange=function(){S.sync=this.checked;if(S.sync)align();save();render()};
tabs();render();
if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
</script>
</body>
</html>
